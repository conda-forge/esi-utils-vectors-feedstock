schema_version: 1

context:
  python_min: "3.11"
  version: "1.1.0"

package:
  name: esi-utils-vectors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/esi-utils-vectors/esi_utils_vectors-${{ version }}.tar.gz
  sha256: 1766a75a49d3d66b8d9cb3c76629fb1cda8ac14bb3370cebedc2e6d51364a7ff

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - setuptools-scm >=3.4
    - pip
  run:
    - python >=${{ python_min }}
    - esi-extern-openquake >=1.0.0
    - numpy >=1.26
    - obspy >=1.3.0

tests:
  - python:
      imports:
        - esi_utils_vectors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: USGS Earthquake Impact Utilities for Vectors
  license: CC0-1.0
  license_file: LICENSE.md
  homepage: https://pypi.org/project/esi-utils-vectors/

extra:
  recipe-maintainers:
    - ocefpaf
