{% set python_min = "3.11" %}

{% set name = "esi-utils-vectors" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1766a75a49d3d66b8d9cb3c76629fb1cda8ac14bb3370cebedc2e6d51364a7ff

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - esi-extern-openquake >=1.0.0
    - numpy >=1.21

test:
  imports:
    - esi_utils_vectors
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://code.usgs.gov/ghsc/esi/esi-utils-vectors
  summary: USGS Earthquake Impact Utilities for Vectors
  license: Unlicense
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ocefpaf
